<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Полный редактор чеков</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--line:#283244;--text:#eef3ff;--muted:#9aa8bd;--accent:#6d8cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172033,#090b10 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1200px;margin:auto;padding:22px}.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#7894ff,#6d46d9);display:grid;place-items:center;font-weight:900}.sub{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{background:#111722d9;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 50px #0005}.panel h2{font-size:16px;margin:0 0 14px}.field{display:block;margin:10px 0 4px;color:#c7d2e5;font-size:13px}input[type=file],input[type=text],input[type=date],input[type=time],select{width:100%;padding:9px;border:1px solid #344157;border-radius:10px;background:#0b1019;color:var(--text);font:inherit}input[type=range]{width:100%}.btn{width:100%;border:0;border-radius:11px;padding:12px 14px;font-weight:750;color:white;background:linear-gradient(135deg,#6d8cff,#7654dd);margin-top:12px;cursor:pointer}.btn.secondary{background:#252f40;border:1px solid #3b4960}.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px}.warning{padding:11px 12px;border:1px solid #775b26;background:#392c14;color:#ffe4a5;border-radius:11px;font-size:12px;line-height:1.5;margin-bottom:14px}.preview-wrap{min-height:500px;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:12px;background:#090d14;border-radius:12px}.canvasbox{position:relative;max-width:100%;box-shadow:0 8px 32px #0008}.canvasbox canvas{display:block;max-width:100%;height:auto}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.box-row{display:flex;gap:6px}.box-row>div{flex:1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}legend{color:var(--accent);font-weight:bold;font-size:13px}
@media(max-width:760px){main{padding:13px}.layout{grid-template-columns:1fr}.preview-wrap{min-height:250px}.top{align-items:flex-start}}
</style>
</head>
<body><main>
<header class="top"><div class="logo">DE</div><div><strong>Receipt Demo Editor</strong><div class="sub">Редактор демонстрационных копий PDF</div></div></header>
<div class="warning">By shizov</div>
<div class="layout">
<section class="panel">
<h2>Настройки и файл</h2>
<label class="field" for="file">Исходный PDF</label><input id="file" type="file" accept="application/pdf,.pdf">

<fieldset>
  <legend>Дата и Время</legend>
  <div class="box-row">
    <div><label class="field" for="date">Дата</label><input id="date" type="date" value="2026-10-16"></div>
    <div><label class="field" for="time">Время</label><input id="time" type="time" value="16:14"></div>
  </div>
  <label class="field" for="dtX">X: <input id="dtX" type="number" value="305" style="width:70px;display:inline-block;padding:4px"> Y: <input id="dtY" type="number" value="165" style="width:70px;display:inline-block;padding:4px"></label>
</fieldset>

<fieldset>
  <legend>Счет списания</legend>
  <input id="f_account" type="text" value="40817810905891906300">
  <div class="box-row">
    <div><label class="field">X</label><input id="accX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="accY" type="number" value="210"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Сумма платежа</legend>
  <input id="f_sum" type="text" value="30 RUR">
  <div class="box-row">
    <div><label class="field">X</label><input id="sumX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="sumY" type="number" value="260"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Назначение платежа</legend>
  <input id="f_purpose" type="text" value="Маршрут № 14 Билет на 1 поездку">
  <div class="box-row">
    <div><label class="field">X</label><input id="purX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="purY" type="number" value="350"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Референс</legend>
  <input id="f_ref" type="text" value="B6024121213007010000120011680501">
  <div class="box-row">
    <div><label class="field">X</label><input id="refX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="refY" type="number" value="430"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Получатель</legend>
  <input id="f_rec" type="text" value="Автобус">
  <div class="box-row">
    <div><label class="field">X</label><input id="recX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="recY" type="number" value="510"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Наименование юр. лица</legend>
  <input id="f_org" type="text" value='ООО "ТЕХНОПРОМ"'>
  <div class="box-row">
    <div><label class="field">X</label><input id="orgX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="orgY" type="number" value="560"></div>
  </div>
</fieldset>

<fieldset>
  <legend>ИНН Получателя</legend>
  <input id="f_inn" type="text" value="6685004357">
  <div class="box-row">
    <div><label class="field">X</label><input id="innX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="innY" type="number" value="610"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Банк получателя</legend>
  <input id="f_bank" type="text" value='АО "Ашот-Бонк"'>
  <div class="box-row">
    <div><label class="field">X</label><input id="bankX" type="number" value="40"></div>
    <div><label class="field">Y</label><input id="bankY" type="number" value="660"></div>
  </div>
</fieldset>

<label class="field" for="globalWeight">Жирность всех полей: <span id="gwval">400</span></label>
<input id="globalWeight" type="range" min="100" max="900" step="100" value="400">

<button class="btn" id="refresh" style="margin-top:14px">Обновить превью</button>
<button class="btn secondary" id="save">Скачать готовый PDF</button>
</section>

<section class="panel">
  <h2>Предпросмотр</h2>
  <div class="preview-wrap" id="wrap">
    <div class="empty" id="empty">Загрузи PDF, чтобы увидеть страницу здесь.</div>
    <div class="canvasbox" id="canvasbox" hidden><canvas id="page"></canvas></div>
  </div>
  <div class="small" id="status" style="margin-top:10px">Инициализация...</div>
</section>
</div></main>
<script>
const $=id=>document.getElementById(id);

function loadScript(urls) {
  return new Promise((resolve, reject) => {
    let i = 0;
    function tryNext() {
      if (i >= urls.length) {
        reject(new Error('Не удалось загрузить библиотеки.'));
        return;
      }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.crossOrigin = 'anonymous';
      s.onload = resolve;
      s.onerror = () => { s.remove(); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

let pdfDoc=null, baseCanvas=null, libsReady=false;

(async()=>{
  try {
    $('status').textContent='Загрузка движка PDF...';
    await loadScript([
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'
    ]);
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    $('status').textContent='Загрузка модуля экспорта...';
    await loadScript([
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'
    ]);

    libsReady = true;
    $('status').textContent='Готово. Выберите PDF-файл.';
  } catch(err) {
    $('status').textContent = 'Ошибка сети.';
    console.error(err);
  }
})();

// Автообновление при изменении любых полей
const inputs = document.querySelectorAll('input');
inputs.forEach(inp => inp.addEventListener('input', drawPreview));

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if(!f) return;
  try {
    if(!libsReady) {
      alert('Библиотеки еще загружаются!');
      return;
    }
    $('status').textContent = 'Чтение PDF...';
    const bytes = await f.arrayBuffer();
    
    pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
    const page = await pdfDoc.getPage(1);
    const vp = page.getViewport({ scale: 1.5 });
    
    baseCanvas = document.createElement('canvas');
    baseCanvas.width = Math.ceil(vp.width);
    baseCanvas.height = Math.ceil(vp.height);
    
    await page.render({
      canvasContext: baseCanvas.getContext('2d'),
      viewport: vp
    }).promise;
    
    $('empty').hidden = true;
    $('canvasbox').hidden = false;
    $('status').textContent = 'Файл загружен. Настройте поля слева.';
    drawPreview();
  } catch(err) {
    $('status').textContent = 'Ошибка: ' + err.message;
    console.error(err);
  }
});

function drawField(ctx, text, x, y, w, h, weight, fontSize=12) {
  if(!text) return;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 2, y - h + 2, w, h + 4);
  ctx.fillStyle = '#111';
  ctx.font = `${weight} ${fontSize}px Tahoma, Arial, sans-serif`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y);
}

function compose(){
  if(!baseCanvas) return null;
  const c = document.createElement('canvas');
  c.width = baseCanvas.width;
  c.height = baseCanvas.height;
  const x = c.getContext('2d');
  x.drawImage(baseCanvas, 0, 0);

  const weight = $('globalWeight').value;
  $('gwval').textContent = weight;

  // 1. Дата и время
  let d = $('date').value;
  if(d) {
    let [yr, m, day] = d.split('-');
    let dateStr = `${day}.${m}.${yr}  ${$('time').value||'00:00'}`;
    drawField(x, dateStr, parseFloat($('dtX').value), parseFloat($('dtY').value), 180, 18, weight, 12);
  }

  // 2. Счет списания
  drawField(x, $('f_account').value, parseFloat($('accX').value), parseFloat($('accY').value), 250, 18, weight, 12);

  // 3. Сумма платежа
  drawField(x, $('f_sum').value, parseFloat($('sumX').value), parseFloat($('sumY').value), 150, 18, weight, 12);

  // 4. Назначение платежа
  drawField(x, $('f_purpose').value, parseFloat($('purX').value), parseFloat($('purY').value), 350, 18, weight, 12);

  // 5. Референс
  drawField(x, $('f_ref').value, parseFloat($('refX').value), parseFloat($('refY').value), 350, 18, weight, 12);

  // 6. Получатель
  drawField(x, $('f_rec').value, parseFloat($('recX').value), parseFloat($('recY').value), 250, 18, weight, 12);

  // 7. Наименование юр. лица
  drawField(x, $('f_org').value, parseFloat($('orgX').value), parseFloat($('orgY').value), 300, 18, weight, 12);

  // 8. ИНН получателя
  drawField(x, $('f_inn').value, parseFloat($('innX').value), parseFloat($('innY').value), 150, 18, weight, 12);

  // 9. Банк получателя
  drawField(x, $('f_bank').value, parseFloat($('bankX').value), parseFloat($('bankY').value), 250, 18, weight, 12);

  return c;
}

function drawPreview(){
  if(!baseCanvas) return;
  const c = compose();
  const out = $('page');
  out.width = c.width;
  out.height = c.height;
  out.getContext('2d').drawImage(c, 0, 0);
}

$('refresh').addEventListener('click', drawPreview);

$('save').addEventListener('click', () => {
  if(!baseCanvas){
    alert('Сначала загрузите PDF.');
    return;
  }
  try {
    const c = compose();
    const { jsPDF } = window.jspdf;
    const orient = c.width >= c.height ? 'landscape' : 'portrait';
    const doc = new jsPDF({
      orientation: orient,
      unit: 'px',
      format: [c.width, c.height],
      hotfixes: ['px_scaling']
    });
    doc.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, c.width, c.height);
    doc.save('demo-copy-watermarked.pdf');
    $('status').textContent = 'Файл успешно скачан!';
  } catch(err) {
    alert('Ошибка при скачивании: ' + err.message);
  }
});
</script>
</body>
</html>
